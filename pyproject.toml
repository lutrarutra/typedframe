[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typedframe"
version = "0.1.0"
description = "A lightweight, type-friendly table abstraction for Python applications."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "lutrarutra" }]
keywords = ["pydantic", "dataframe", "typed", "table", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
polars = ["polars>=1.0"]
all = ["pandas>=2.0", "polars>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "pandas>=2.0",
    "polars>=1.0",
    "ipykernel",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "*.ipynb",
    "*.md",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
extend-ignore = ["E501", "W292", "W293", "I001", "N999", "B008", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["typedframe"]

[tool.hatch.build.targets.wheel]
packages = ["src/typedframe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
